
services:
  app:
    build: &app-build
      context: .
      dockerfile: Dockerfile
      target: development
    environment: &app-env
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/messages"
      MCP_TENANT_ID: ${MCP_TENANT_ID:-}
      APP_DEMO_DETERMINISTIC: ${APP_DEMO_DETERMINISTIC:-true}
      DLQ_AI_PROVIDER: ${DLQ_AI_PROVIDER:-openai}
      DLQ_AI_MODEL: ${DLQ_AI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      MERCURE_URL: http://app/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
      MERCURE_COOKIE_NAME: ${MERCURE_COOKIE_NAME:-mercure_access_token}
      DLQ_DEMO_PASSWORD: ${DLQ_DEMO_PASSWORD:-}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_JWT_ISSUER: ${MERCURE_JWT_ISSUER:-http://localhost}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
    volumes:
      - frankenphp_mercure_data:/data/mercure
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/healthcheck-75ce6228ac8d09dc80af6e956d7ce"]
      interval: 3s
      timeout: 2s
      retries: 20
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: *app-build
    environment: *app-env
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy

  worker:
    build: &worker-build
      context: .
      dockerfile: Dockerfile.worker
      args:
        APP_ENV: ${APP_ENV:-dev}
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/%2f/messages"
      MCP_TENANT_ID: ${MCP_TENANT_ID:-}
      APP_DEMO_DETERMINISTIC: ${APP_DEMO_DETERMINISTIC:-true}
      DLQ_AI_PROVIDER: ${DLQ_AI_PROVIDER:-openai}
      DLQ_AI_MODEL: ${DLQ_AI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      MERCURE_URL: http://app/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_JWT_ISSUER: ${MERCURE_JWT_ISSUER:-http://localhost}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_healthy

  outbox-publisher:
    build: *worker-build
    command: ["php", "bin/console", "dlq:publish-outbox", "--loop"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=utf8"
      MERCURE_URL: http://app/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_JWT_ISSUER: ${MERCURE_JWT_ISSUER:-http://localhost}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18.7}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  frankenphp_mercure_data:
###< symfony/mercure-bundle ###
