framework:
    http_client:
        scoped_clients:
            dlq_ai.client:
                scope: '^https://(api\.openai\.com|api\.anthropic\.com|generativelanguage\.googleapis\.com)/'
                retry_failed:
                    max_retries: 2
                    delay: 1000
                    multiplier: 2
                    max_delay: 5000
                    jitter: 0.1
                    http_codes: [429, 502, 503, 504]
